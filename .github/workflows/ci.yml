name: CI

# Runs on every push to main, on pull requests, and on demand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZEPHYR_VERSION: v4.4.2
  SDK_VERSION: "1.0.1"
  CI_ROOT: ${{ github.workspace }}

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    name: Unit tests (native_sim)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          path: app

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore the Zephyr workspace cache
        uses: actions/cache@v6
        with:
          path: zephyrproject
          key: zephyr-${{ env.ZEPHYR_VERSION }}-${{ hashFiles('app/tools/ci_setup.sh') }}

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build device-tree-compiler

      - name: Set up the Zephyr workspace
        run: bash app/tools/ci_setup.sh workspace

      - name: Build the ztest suites for native_sim
        working-directory: zephyrproject/zephyr
        env:
          ZEPHYR_TOOLCHAIN_VARIANT: host
        run: west build -p always -b native_sim/native/64 "$GITHUB_WORKSPACE/app/tests/unit" -d "$GITHUB_WORKSPACE/build/unit"

      - name: Run the ztest suites
        run: |
          "$GITHUB_WORKSPACE/build/unit/zephyr/zephyr.exe" | tee ztest.log
          { echo '### ztest results'; echo '```'; grep -E '^SUITE |PROJECT EXECUTION' ztest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the plain C tests (tests/host)
        run: make -C app/tests/host CMSIS_DSP="$GITHUB_WORKSPACE/zephyrproject/modules/lib/cmsis-dsp"

  firmware:
    name: Firmware build (Nano 33 BLE)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          path: app

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore the Zephyr workspace cache
        uses: actions/cache@v6
        with:
          path: zephyrproject
          key: zephyr-${{ env.ZEPHYR_VERSION }}-${{ hashFiles('app/tools/ci_setup.sh') }}

      - name: Restore the Zephyr SDK cache
        uses: actions/cache@v6
        with:
          path: zephyr-sdk-${{ env.SDK_VERSION }}
          key: zephyr-sdk-${{ env.SDK_VERSION }}-linux-x86_64-arm-${{ hashFiles('app/tools/ci_setup.sh') }}

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Set up the Zephyr workspace
        run: bash app/tools/ci_setup.sh workspace

      - name: Set up the Zephyr SDK (ARM toolchain)
        run: bash app/tools/ci_setup.sh sdk

      - name: Build the firmware
        working-directory: zephyrproject/zephyr
        env:
          ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/zephyr-sdk-${{ env.SDK_VERSION }}
        run: |
          west build -p always -b arduino_nano_33_ble/nrf52840 "$GITHUB_WORKSPACE/app" -d "$GITHUB_WORKSPACE/build/firmware" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          { echo '### Firmware memory use'; echo '```'; grep -A3 'Memory region' "$GITHUB_WORKSPACE/build.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the firmware images
        uses: actions/upload-artifact@v7
        with:
          name: firmware-nano33ble
          path: |
            build/firmware/zephyr/zephyr.bin
            build/firmware/zephyr/zephyr.hex
            build/firmware/zephyr/zephyr.elf
          if-no-files-found: error
