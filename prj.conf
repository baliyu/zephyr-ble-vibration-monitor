# Console over USB (CDC ACM), following Zephyr v4.4's samples/subsys/usb/console
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Vibration monitor"

# Motion sensor (LSM9DS1, started by main.c with device_init)
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_REGULATOR=y

# FFT: CMSIS-DSP real FFT on the Cortex-M4F's floating-point unit
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Bluetooth LE peripheral (custom GATT service in src/ble_vib.c)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="VibMon Nano33"

# BLE security (step 8a): authenticated LE Secure Connections, passkey shown on
# the USB console.
CONFIG_BT_SMP=y
# Secure Connections Only mode: selects BT_SMP_SC_PAIR_ONLY, requires security
# level 4 and makes smp.c reject Just Works (unauthenticated) pairing.
CONFIG_BT_SMP_SC_ONLY=y
CONFIG_BT_SMP_ENFORCE_MITM=y
CONFIG_BT_BONDABLE=y
# Two phones may be paired; a third (who also needs the passkey) replaces the oldest.
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
# Precaution (not measured): pairing callbacks run on the BT RX thread and print.
CONFIG_BT_RX_STACK_SIZE=2048

# Step 8b: pairing keys survive RESET. Settings stored with NVS in the board's
# free storage_partition (0xF8000, 32 KB), as in Zephyr's peripheral_hids sample.
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
# Settings are written from the system work queue (the HIDS sample raises it too).
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Never enable CONFIG_BT_FIXED_PASSKEY or CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE:
# ble_sec.c refuses to build with the first.

# Threads: the sampler (priority 2) pre-empts the analysis in main (priority 7)
CONFIG_MAIN_THREAD_PRIORITY=7
# 3072 since step 8b: settings_load() (NVS) runs on this thread. Precaution, not measured.
CONFIG_MAIN_STACK_SIZE=3072

# No CONFIG_LOG: with the console on USB, immediate-mode logging from the USB
# stack itself goes through the USB link being set up.
