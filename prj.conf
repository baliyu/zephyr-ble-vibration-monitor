# Console over USB (CDC ACM), following Zephyr v4.4's samples/subsys/usb/console
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Vibration monitor"

# Motion sensor (LSM9DS1, started by main.c with device_init)
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_REGULATOR=y

# FFT: CMSIS-DSP real FFT on the Cortex-M4F's floating-point unit
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Threads: the sampler (priority 2) pre-empts the analysis in main (priority 7)
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_MAIN_STACK_SIZE=2048

# No CONFIG_LOG: with the console on USB, immediate-mode logging from the USB
# stack itself goes through the USB link being set up.
