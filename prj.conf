# Console over USB (CDC ACM), following Zephyr v4.4's samples/subsys/usb/console
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Vibration monitor"

# Motion sensor (LSM9DS1, started by main.c with device_init)
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_REGULATOR=y

# No CONFIG_LOG: with the console on USB, immediate-mode logging from the USB
# stack itself goes through the USB link being set up (see README lessons).
